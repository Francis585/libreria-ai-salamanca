name: Publicar

# Dos ramas, dos sitios:
#   main        → libreria-ai-salamanca.vercel.app  (la original)
#   experimento → libreria-ai-lab.vercel.app        (el laboratorio)
#
# Así se puede probar en el laboratorio sin tocar la original, y cuando algo
# está listo se fusiona `experimento` en `main` y se publica sola.
on:
  push:
    branches: [main, experimento]
  workflow_dispatch:
    inputs:
      destino:
        description: 'Proyecto a publicar (por defecto, el de la rama)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - original
          - laboratorio

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npx tsc --noEmit

      - name: Compilación
        run: npm run build

      - name: Desplegar en producción
        env:
          PROYECTO_LAB: ${{ secrets.VERCEL_PROJECT_ID }}
          PROYECTO_ORIGINAL: ${{ secrets.VERCEL_PROJECT_ID_COPIA }}
          ELEGIDO: ${{ github.event.inputs.destino }}
        run: |
          set -e
          destino="$ELEGIDO"
          if [ -z "$destino" ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then destino="original"; else destino="laboratorio"; fi
          fi
          if [ "$destino" = "original" ]; then
            proyecto="$PROYECTO_ORIGINAL"
          else
            proyecto="$PROYECTO_LAB"
          fi
          if [ -z "$proyecto" ]; then
            echo "Proyecto sin id configurado; se omite."
            exit 0
          fi
          echo "Publicando en $destino ($proyecto)"
          VERCEL_PROJECT_ID="$proyecto" npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      # Avisa a Bing/Yandex de las URLs publicadas (Google va por Search Console)
      - name: Avisar a los buscadores (IndexNow)
        run: node scripts/indexnow.mjs
