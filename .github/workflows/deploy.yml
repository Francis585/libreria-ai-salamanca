name: Publicar

# Lo que antes se hacía a mano: al empujar a main se comprueban los tipos, se
# compila y se publica en los dos proyectos de Vercel (la web y su copia).
# El catálogo encargable lo refrescan los cron de Vercel, no este flujo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npx tsc --noEmit

      - name: Compilación
        run: npm run build

      - name: Desplegar en producción
        env:
          PROYECTO_WEB: ${{ secrets.VERCEL_PROJECT_ID }}
          PROYECTO_COPIA: ${{ secrets.VERCEL_PROJECT_ID_COPIA }}
        run: |
          set -e
          for proyecto in "$PROYECTO_WEB" "$PROYECTO_COPIA"; do
            if [ -z "$proyecto" ]; then
              echo "Proyecto sin id configurado; se omite."
              continue
            fi
            echo "Desplegando $proyecto"
            VERCEL_PROJECT_ID="$proyecto" npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          done

      # Avisa a Bing/Yandex de las URLs publicadas (Google va por Search Console)
      - name: Avisar a los buscadores (IndexNow)
        run: node scripts/indexnow.mjs
