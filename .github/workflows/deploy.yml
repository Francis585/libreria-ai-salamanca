name: Publicar

# Flujo del LABORATORIO.
#
# `libreria-ai-lab` es la copia donde se experimenta. Cada push a main compila y
# la publica SOLO a ella: la tienda original no se toca hasta que se decida
# promover. Para promover hay que lanzar este flujo a mano con destino
# "original" (Actions → Publicar → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: 'Proyecto a publicar'
        required: true
        default: laboratorio
        type: choice
        options:
          - laboratorio
          - original

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npx tsc --noEmit

      - name: Compilación
        run: npm run build

      - name: Desplegar en producción
        env:
          PROYECTO_LAB: ${{ secrets.VERCEL_PROJECT_ID }}
          PROYECTO_ORIGINAL: ${{ secrets.VERCEL_PROJECT_ID_COPIA }}
          DESTINO: ${{ github.event.inputs.destino }}
        run: |
          set -e
          # Un push normal va solo al laboratorio; la original, únicamente a mano.
          if [ "$DESTINO" = "original" ]; then
            proyecto="$PROYECTO_ORIGINAL"
            echo "Promoviendo a la tienda original."
          else
            proyecto="$PROYECTO_LAB"
          fi
          if [ -z "$proyecto" ]; then
            echo "Proyecto sin id configurado; se omite."
            exit 0
          fi
          VERCEL_PROJECT_ID="$proyecto" npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      # Avisa a Bing/Yandex de las URLs publicadas (Google va por Search Console)
      - name: Avisar a los buscadores (IndexNow)
        if: ${{ github.event.inputs.destino != 'original' }}
        run: node scripts/indexnow.mjs
